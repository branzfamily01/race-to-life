<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Race to Life</title>
<link rel="manifest" href="manifest.webmanifest?v=20260816-3">
<link rel="stylesheet" href="styles.css?v=20260816-3">
<style>.bootmsg{max-width:540px;margin:60px auto;padding:20px;color:#cfe7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bootmsg b{display:block;font-size:22px;margin-bottom:8px}.bootmsg small{color:#7893aa}</style>
</head>
<body>
<main id="app"><div class="bootmsg"><b>🏎️ Race to Life</b><span>起動中…</span><small>この表示のままなら再読み込みしてください。</small></div></main>
<script>
window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&a.textContent.indexOf('起動中')>=0){a.innerHTML='<div class="bootmsg"><b>⚠️ 起動エラー</b><span>'+String(e.message||'JavaScriptを読み込めませんでした')+'</span></div>';}});
</script>
<script src="app.js?v=20260816-3"></script>
</body>
</html>
